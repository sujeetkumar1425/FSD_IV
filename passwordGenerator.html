<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="hello"></p>
    <button onclick="generate()">Generate</button>
    <script>
        function generate(){
            var char="abcdefghijklmonpqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ@$:1234567890";
            var password="";
            for(var i=0;i<8;i++){
                var randomIndex=Math.floor(Math.random()*char.length);
                password=password+char[randomIndex];
            }
            document.getElementById("hello").innerHTML=password;


        }
    </script>
</body>
</html>
